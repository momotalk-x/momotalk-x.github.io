<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软件介绍页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 60px 80px;
            margin-top: 40px;
        }

        .logo {
            margin-bottom: 50px;
        }

        .logo img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .btn {
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-download {
            background-color: #667eea;
            color: white;
        }

        .btn-download:hover {
            background-color: #5a6fd6;
            transform: translateY(-5px);
        }

        .btn-about {
            background-color: #f093fb;
            color: white;
        }

        .btn-about:hover {
            background-color: #e87ad4;
            transform: translateY(-5px);
        }

        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./icon.png" alt="工作区软件图标" onerror="this.style.display='none'; this.parentNode.innerHTML='<p style=\'color:#667eea;font-size:30px;margin-bottom:20px;\'>🚀</p>'">
        </div>

        <div class="buttons">
            <a href="./软件下载.html" class="btn btn-download" onclick="alert('跳转到下载页面')">下载软件</a>
            <button onclick="alert('了解软件功能介绍')" class="btn btn-about">了解软件</button>
        </div>
    </div>
</body>
</html>
